<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cineroom</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
    <style>
        :root {
            --bg: #0c0d0e;
            --s1: #161718;
            --s2: #202123;
            --tx: #fff;
            --mu: #8b8d91;
            --y: #f6f08b;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: Outfit, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            cursor: pointer;
            background: none
        }

        a {
            color: inherit;
            text-decoration: none
        }

        svg.lucide {
            width: 1.1em;
            height: 1.1em
        }

        :focus-visible {
            outline: 2px solid var(--y);
            outline-offset: 2px
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 5vw;
            background: #0c0d0ecc;
            backdrop-filter: blur(12px)
        }

        .logo {
            font-weight: 800;
            font-size: 19px;
            letter-spacing: .5px;
            color: var(--y);
            flex: 1
        }

        .pill {
            display: flex;
            background: var(--s1);
            border-radius: 999px;
            padding: 5px;
            gap: 2px;
            border: 1px solid #ffffff0a
        }

        .tab {
            padding: 10px 26px;
            border-radius: 999px;
            font-size: 14px;
            color: var(--mu);
            font-weight: 500
        }

        .tab:hover {
            color: #fff
        }

        .tab.on {
            background: var(--bg);
            color: #fff
        }

        .nr {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            align-items: center
        }

        .sb {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--y);
            color: #111;
            display: grid;
            place-items: center
        }

        .lg {
            height: 46px;
            padding: 0 24px;
            border-radius: 999px;
            background: var(--s1);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px
        }

        #sq {
            width: 0;
            opacity: 0;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: var(--s1);
            color: #fff;
            font: inherit;
            font-size: 14px;
            height: 46px;
            outline: 0;
            transition: width .3s, opacity .3s, padding .3s
        }

        #sq.on {
            width: min(260px, 40vw);
            opacity: 1;
            padding: 0 18px
        }

        h1.hd {
            font-weight: 300;
            font-size: clamp(30px, 4.6vw, 56px);
            line-height: 1.12;
            text-align: center;
            margin: 44px auto 14px;
            max-width: 16em;
            letter-spacing: -1px
        }

        h1.hd b {
            font-weight: 700
        }

        .sub {
            text-align: center;
            color: var(--mu);
            font-style: italic;
            font-size: 15px;
            line-height: 1.5;
            max-width: 34em;
            margin: 0 auto 34px;
            padding: 0 20px
        }

        .h2 {
            text-align: center;
            font-weight: 600;
            font-size: clamp(28px, 3.6vw, 44px);
            margin: 0 0 8px;
            letter-spacing: -.8px
        }

        sec,
        section {
            display: block;
            overflow-x: clip
        }

        .stage {
            position: relative;
            perspective: 1400px;
            --w: min(60vw, 700px);
            --h: min(34vw, 390px)
        }

        .stage {
            height: var(--h)
        }

        .stage.t {
            --w: min(21vw, 230px);
            --h: min(33vw, 350px)
        }

        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--w);
            height: 100%;
            border-radius: 28px;
            background: var(--s2) center/cover;
            transition: transform .7s cubic-bezier(.2, .8, .2, 1), opacity .5s;
            cursor: pointer;
            overflow: hidden
        }

        .slide:after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, #000d, #0000 55%);
            opacity: 0;
            transition: opacity .4s
        }

        .slide.c:after {
            opacity: 1
        }

        .info {
            position: absolute;
            z-index: 2;
            left: 26px;
            right: 26px;
            bottom: 22px;
            opacity: 0;
            transition: opacity .4s;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 12px
        }

        .slide.c .info {
            opacity: 1
        }

        .info b {
            font-size: clamp(18px, 2.4vw, 30px);
            font-weight: 700;
            letter-spacing: -.5px;
            line-height: 1.1
        }

        .mc {
            display: flex;
            gap: 8px
        }

        .mc span {
            background: #ffffff26;
            backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 7px 11px;
            font-size: 12px;
            display: flex;
            gap: 5px;
            align-items: center
        }

        .t .info {
            left: 16px;
            right: 16px;
            bottom: 16px
        }

        .t .info b {
            font-size: 20px
        }

        .pg {
            display: flex;
            justify-content: center;
            margin: 26px auto 0;
            gap: 8px;
            width: max-content;
            background: var(--s1);
            padding: 8px 12px;
            border-radius: 999px
        }

        .pg span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff33;
            cursor: pointer;
            transition: width .3s, background .3s
        }

        .pg span.on {
            width: 44px;
            border-radius: 6px;
            background: var(--y)
        }

        .fg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            max-width: 1000px;
            margin: 36px auto 0;
            padding: 0 5vw
        }

        .tile {
            background: var(--s1);
            border-radius: 26px;
            padding: 34px 20px;
            text-align: center;
            border: 1px solid #ffffff08
        }

        .tile .ib {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: #ffffff14;
            color: var(--y);
            display: grid;
            place-items: center;
            margin: 0 auto 14px;
            font-size: 22px
        }

        .tile b {
            display: block;
            font-size: 19px;
            margin-bottom: 6px
        }

        .tile span {
            color: var(--mu);
            font-size: 14px;
            line-height: 1.5
        }

        .mw {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 920px;
            margin: 0 auto;
            padding: 0 5vw
        }

        .mo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 22px;
            border-radius: 999px;
            background: var(--s1);
            border: 1px solid #ffffff0a;
            font-weight: 500;
            font-size: 15px;
            transition: background .2s
        }

        .mo:hover {
            background: var(--s2)
        }

        .mo.on {
            background: var(--y);
            color: #111
        }

        .pt2 {
            display: flex;
            margin: 22px auto 30px;
            background: var(--s1);
            border-radius: 999px;
            padding: 5px;
            width: max-content
        }

        .pt2 button {
            padding: 11px 34px;
            border-radius: 999px;
            color: var(--mu);
            font-weight: 600
        }

        .pt2 button.on {
            background: var(--y);
            color: #111
        }

        .gr {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            padding: 0 5vw
        }

        .cd {
            aspect-ratio: 2/3;
            border-radius: 22px;
            background: var(--s2) center/cover;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform .25s
        }

        .cd:hover {
            transform: translateY(-6px)
        }

        .cd:after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, #000d, #0000 50%)
        }

        .cd b {
            position: absolute;
            z-index: 2;
            left: 14px;
            right: 14px;
            bottom: 12px;
            font-size: 15px;
            font-weight: 600
        }

        .fr {
            position: absolute;
            z-index: 2;
            top: 12px;
            left: 12px;
            background: var(--y);
            color: #111;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 999px
        }

        .cta {
            margin: 90px auto 0;
            max-width: 1000px;
            background: var(--y);
            color: #111;
            border-radius: 48px 48px 0 0;
            padding: 48px 48px 70px
        }

        .cta h3 {
            font-size: clamp(24px, 3vw, 36px);
            margin: 0 0 10px;
            letter-spacing: -.8px;
            line-height: 1.15;
            max-width: 15em
        }

        .cta p {
            margin: 0 0 22px;
            font-style: italic;
            font-size: 14px;
            opacity: .75
        }

        .kf {
            display: flex;
            max-width: 460px;
            background: #0c0d0e;
            border-radius: 999px;
            padding: 6px
        }

        .kf input {
            flex: 1;
            background: none;
            border: 0;
            color: #fff;
            font: inherit;
            font-size: 14px;
            padding: 0 18px;
            outline: 0;
            min-width: 0
        }

        .kf button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--y);
            color: #111;
            display: grid;
            place-items: center
        }

        footer {
            background: var(--y);
            color: #111;
            padding: 0 5vw 40px;
            text-align: center;
            font-size: 13px
        }

        footer .in {
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 24px;
            border-top: 1px solid #0002
        }

        .msg {
            text-align: center;
            color: var(--mu);
            padding: 120px 20px
        }

        .md {
            position: fixed;
            inset: 0;
            z-index: 40;
            background: #000d;
            display: none;
            overflow: auto;
            padding: 4vh 16px
        }

        .md.on {
            display: block
        }

        .bx {
            max-width: 900px;
            margin: 0 auto;
            background: var(--s1);
            border-radius: 32px;
            overflow: hidden;
            position: relative
        }

        .top {
            height: min(44vw, 400px);
            background: center/cover;
            position: relative
        }

        .top:after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, var(--s1), #16171800 70%)
        }

        .cl {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 3;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--y);
            color: #111;
            display: grid;
            place-items: center
        }

        .bd {
            padding: 0 34px 34px;
            margin-top: -80px;
            position: relative;
            z-index: 2
        }

        .bd h1 {
            font-size: 40px;
            margin: 0 0 12px;
            letter-spacing: -1px
        }

        .bd p {
            color: #d5d7da;
            line-height: 1.65;
            font-size: 15px;
            max-width: 68ch
        }

        .sh {
            color: var(--mu);
            font-size: 13px;
            margin: 20px 0 8px;
            font-weight: 500
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .chip {
            background: var(--s2);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px
        }

        a.chip {
            background: var(--y);
            color: #111;
            font-weight: 600
        }

        .tr {
            aspect-ratio: 16/9;
            width: 100%;
            border: 0;
            border-radius: 20px;
            margin-top: 6px;
            background: #000
        }

        .go {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--y);
            color: #111;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 999px;
            margin: 6px 0 16px
        }

        #pl {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 60;
            display: none
        }

        #pl.on {
            display: block
        }

        #pl video {
            width: 100%;
            height: 100%
        }

        #sbt {
            position: absolute;
            left: 50%;
            bottom: var(--bt, 10%);
            transform: translateX(-50%);
            max-width: 82%;
            text-align: center;
            font-size: var(--fs, 28px);
            color: var(--col, #fff);
            font-family: var(--ff, Outfit), sans-serif;
            pointer-events: none;
            transition: bottom .2s
        }

        #sbs {
            display: inline;
            background: var(--bgc, #0008);
            padding: .12em .5em;
            border-radius: 8px;
            line-height: 1.55;
            white-space: pre-line;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
            text-shadow: 0 0 4px #000, 0 1px 6px #000
        }

        #sbs:empty {
            display: none
        }

        #ui {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            transition: opacity .3s
        }

        #ui.h {
            opacity: 0
        }

        #ui.h .bar {
            cursor: none
        }

        .pt,
        .pb,
        .pn {
            pointer-events: auto
        }

        .pt {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px 22px;
            background: linear-gradient(#000b, #0000)
        }

        .pb {
            padding: 30px 22px 18px;
            background: linear-gradient(#0000, #000d);
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .sk {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            font-variant-numeric: tabular-nums
        }

        .bar {
            flex: 1;
            height: 6px;
            background: #ffffff33;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            touch-action: none
        }

        .bar:before {
            content: "";
            position: absolute;
            inset: -12px 0
        }

        .buf,
        .pr {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            border-radius: 4px;
            width: 0
        }

        .buf {
            background: #ffffff40
        }

        .pr {
            background: var(--y)
        }

        .kn {
            position: absolute;
            top: 50%;
            left: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--y);
            transform: translate(-50%, -50%) scale(.8);
            transition: transform .15s
        }

        .bar:hover .kn {
            transform: translate(-50%, -50%) scale(1.25)
        }

        .tip {
            position: absolute;
            bottom: 18px;
            transform: translateX(-50%);
            background: #000d;
            padding: 4px 9px;
            border-radius: 8px;
            font-size: 12px;
            display: none
        }

        .bar:hover .tip {
            display: block
        }

        .ctl {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .sp {
            flex: 1
        }

        .ctl button,
        .pt button,
        .pn button,
        .pn select {
            height: 42px;
            padding: 0 16px;
            border-radius: 999px;
            background: #ffffff22;
            color: #fff;
            font: inherit;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 0
        }

        .ctl button:hover,
        .pn button:hover {
            background: #ffffff38
        }

        .ctl .y {
            background: var(--y);
            color: #111;
            width: 46px;
            height: 46px;
            padding: 0;
            justify-content: center
        }

        .ctl input[type=range] {
            width: 90px
        }

        input[type=range] {
            accent-color: var(--y)
        }

        #ui .pn {
            display: none;
            position: absolute;
            right: 22px;
            bottom: 118px;
            width: min(340px, calc(100vw - 44px));
            max-height: 62vh;
            overflow: auto;
            background: #141516f5;
            border-radius: 24px;
            padding: 18px 18px 20px
        }

        #ui .pn.on {
            display: block
        }

        .pn h4 {
            margin: 0 0 10px;
            font-size: 16px
        }

        .pn .lb {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--mu);
            margin: 14px 0 6px
        }

        .pn .lb b {
            color: #fff
        }

        .pn input[type=range] {
            width: 100%
        }

        .r2 {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center
        }

        .r2 button,
        .pn select {
            height: 36px;
            padding: 0 12px;
            font-size: 13px
        }

        .pn select {
            width: 100%
        }

        .mu {
            font-size: 12px;
            color: var(--mu)
        }

        .sw {
            width: 30px !important;
            height: 30px !important;
            padding: 0 !important;
            border: 2px solid #ffffff55 !important
        }

        .sw.on {
            border-color: #fff !important;
            transform: scale(1.15)
        }

        #scol {
            width: 36px;
            height: 30px;
            border: 0;
            background: none;
            padding: 0
        }

        #qs button,
        #lv button {
            width: 100%;
            justify-content: space-between;
            margin-bottom: 6px;
            border-radius: 14px;
            height: 40px
        }

        .pn button.on {
            background: var(--y);
            color: #111
        }

        .tg {
            position: fixed;
            left: 50%;
            top: 90px;
            transform: translateX(-50%);
            background: #000e;
            padding: 11px 18px;
            border-radius: 999px;
            font-size: 14px;
            z-index: 70;
            display: none
        }

        @media(max-width:760px) {
            .logo {
                display: none
            }

            .pill {
                overflow-x: auto;
                max-width: 72vw
            }

            .tab {
                padding: 10px 14px
            }

            .stage {
                --w: 78vw;
                --h: 50vw
            }

            .stage.t {
                --w: 42vw;
                --h: 62vw
            }

            .bd {
                padding: 0 18px 24px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">CINEROOM</div>
        <div class="pill" id="tabs"><button class="tab on" data-t="home">Home</button><button class="tab"
                data-t="movies">Movies</button><button class="tab" data-t="moods">Moods</button><button class="tab"
                data-t="classics">Classics</button><button class="tab" data-t="kids">Kids</button></div>
        <div class="nr"><input id="sq" placeholder="Search movies" aria-label="Search"><button class="sb" id="sbtn"
                aria-label="Search"><i data-lucide="search"></i></button></div>
    </nav>
    <main id="app"></main>
    <div class="md" id="md">
        <div class="bx" id="bx"></div>
    </div>
    <div id="pl"><video id="v" playsinline></video>
        <div id="sbt"><span id="sbs"></span></div>
        <div id="ui">
            <div class="pt"><button id="bk"><i data-lucide="arrow-left"></i>Back</button><b id="ptl"></b></div>
            <div class="pn" id="ps">
                <h4>Subtitles</h4>
                <div class="r2"><button id="sld"><i data-lucide="upload"></i>Load file</button><button id="stg"><i
                            data-lucide="eye"></i><span id="stt">On</span></button><span class="mu" id="scn">No file
                        loaded</span></div>
                <div class="lb">Sync with audio <b id="so">0.0s</b></div>
                <div class="r2"><button data-sy="-1">-1s</button><button data-sy="-.5">-0.5</button><button
                        data-sy="-.1">-0.1</button><button data-sy=".1">+0.1</button><button
                        data-sy=".5">+0.5</button><button data-sy="1">+1s</button><button data-sy="0">Reset</button>
                </div>
                <div class="r2"><button id="snow"><i data-lucide="crosshair"></i>Press when a line is spoken</button>
                </div>
                <div class="lb">Size <b id="szv"></b></div><input type="range" id="ssz" min="14" max="64">
                <div class="lb">Height from bottom <b id="pov"></b></div><input type="range" id="spo" min="2" max="45">
                <div class="lb">Background <b id="bgv"></b></div><input type="range" id="sbg" min="0" max="90">
                <div class="lb">Color</div>
                <div class="r2"><button class="sw" data-c="#ffffff" style="background:#fff"></button><button class="sw"
                        data-c="#f6f08b" style="background:#f6f08b"></button><button class="sw" data-c="#5eead4"
                        style="background:#5eead4"></button><button class="sw" data-c="#86efac"
                        style="background:#86efac"></button><button class="sw" data-c="#fca5a5"
                        style="background:#fca5a5"></button><input type="color" id="scol" aria-label="Custom color">
                </div>
                <div class="lb">Font</div><select id="sfn">
                    <option>Outfit</option>
                    <option>Arial</option>
                    <option>Georgia</option>
                    <option>Courier New</option>
                </select>
                <div class="r2"><button id="srs">Reset style</button></div>
            </div>

        const bar = $("bar"); let drag = false; const pp = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) };
        bar.onpointerdown = e => { if (!v.duration) return; drag = true; bar.setPointerCapture(e.pointerId); v.currentTime = pp(e) * v.duration };
        bar.onpointermove = e => { const p = pp(e); $("tip").style.left = p * 100 + "%"; $("tip").textContent = fmt(p * (v.duration || 0)); if (drag && v.duration) v.currentTime = p * v.duration };
        bar.onpointerup = bar.onpointercancel = () => drag = false;
        function prog() {
            const d = v.duration || 0, t = v.currentTime || 0, p = d ? t / d * 100 : 0; $("pr").style.width = p + "%"; $("kn").style.left = p + "%"; $("tc").textContent = fmt(t); $("td").textContent = fmt(d);
            let b = 0; for (let i = 0; i < v.buffered.length; i++)if (v.buffered.start(i) <= t && v.buffered.end(i) >= t) b = v.buffered.end(i); $("buf").style.width = (d ? b / d * 100 : 0) + "%"
        }
        v.ontimeupdate = v.onprogress = v.ondurationchange = prog;
        /* subtitles */
        function parse(x) { const o = []; x.replace(/\r/g, "").split(/\n\n+/).forEach(b => { const L = b.split("\n"), k = L.findIndex(l => l.includes("-->")); if (k < 0) return; const m = L[k].match(/(?:(\d+):)?(\d+):(\d+)[,.](\d+)\s*-->\s*(?:(\d+):)?(\d+):(\d+)[,.](\d+)/); if (!m) return; const T = (h, mi, s, ms) => (+h || 0) * 3600 + +mi * 60 + +s + +ms.padEnd(3, "0").slice(0, 3) / 1000; o.push({ a: T(m[1], m[2], m[3], m[4]), b: T(m[5], m[6], m[7], m[8]), t: L.slice(k + 1).join("\n").replace(/<[^>]+>/g, "") }) }); return o }
        $("sld").onclick = () => $("sf").click();
        $("sf").onchange = async e => { const f = e.target.files[0]; if (f) { cues = parse(await f.text()); $("scn").textContent = cues.length + " lines: " + f.name.slice(0, 22); SUB.on = true; applySub(); toast(cues.length + " subtitle lines loaded") } };
        $("stg").onclick = () => { SUB.on = !SUB.on; applySub() };
        $("ps").onclick = e => {
            const y = e.target.closest("[data-sy]"), c = e.target.closest(".sw");
            if (y) { const d = parseFloat(y.dataset.sy); setOff(d === 0 ? 0 : off + d) } if (c) { SUB.col = c.dataset.c; applySub() }
        };
        $("snow").onclick = () => { if (!cues.length) return toast("Load a subtitle file first"); const t = v.currentTime - off; let b = cues[0]; cues.forEach(c => { if (Math.abs(c.a - t) < Math.abs(b.a - t)) b = c }); setOff(v.currentTime - b.a); toast("Aligned: offset " + off.toFixed(1) + "s") };
        $("ssz").oninput = e => { SUB.size = +e.target.value; applySub() }; $("spo").oninput = e => { SUB.pos = +e.target.value; applySub() }; $("sbg").oninput = e => { SUB.bg = +e.target.value; applySub() };
        $("scol").oninput = e => { SUB.col = e.target.value; applySub() }; $("sfn").onchange = e => { SUB.font = e.target.value; applySub() };
        $("srs").onclick = () => { SUB = { size: 28, pos: 10, bg: 55, col: "#ffffff", font: "Outfit", on: true }; applySub() };
        setInterval(() => { const t = v.currentTime - off, c = SUB.on && cues.find(c => t >= c.a && t <= c.b); $("sbs").textContent = c ? c.t : "" }, 80);
        const tog = id => { ["ps", "pq"].forEach(x => $(x).classList.toggle("on", x === id && !$(x).classList.contains("on"))) };
        $("bsb").onclick = () => tog("ps"); $("bq").onclick = () => tog("pq");
        function wake() { $("ui").classList.remove("h"); clearTimeout(pt); pt = setTimeout(() => { if (!v.paused && !$("ps").classList.contains("on") && !$("pq").classList.contains("on")) $("ui").classList.add("h") }, 3000) }
        $("pl").onmousemove = $("pl").ontouchstart = wake;
        document.addEventListener("keydown", e => {
            if (!$("pl").classList.contains("on") || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; wake(); const k = e.key.toLowerCase();
            if (k === " " || k === "k") { e.preventDefault(); $("pp").click() } else if (k === "arrowleft") v.currentTime -= 5; else if (k === "arrowright") v.currentTime += 5; else if (k === "arrowup") { e.preventDefault(); v.volume = Math.min(1, v.volume + .1) } else if (k === "arrowdown") { e.preventDefault(); v.volume = Math.max(0, v.volume - .1) }
            else if (k === "m") $("mu").click(); else if (k === "f") $("fu").click(); else if (k === "c") { SUB.on = !SUB.on; applySub() } else if (k === "g") setOff(off - .1); else if (k === "h") setOff(off + .1); else if (k === "escape") { $("ps").classList.remove("on"); $("pq").classList.remove("on") }
        });
        ic(); show();
    </script>
</body>
